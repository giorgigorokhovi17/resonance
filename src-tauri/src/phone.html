<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>Undertone</title>
<style>
  :root { --bg: #0d0d10; --panel: #17171c; --line: #26262e; --fg: #f2f2f5; --muted: #9a9aa6; --accent: #8b6cff; --accent2: #5aa9ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: rgb(13 13 16 / 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { display: none; border: 0; background: var(--panel); color: var(--fg); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
  .back.show { display: block; }
  main { padding: 12px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { border: 0; padding: 0; background: none; color: inherit; text-align: left; }
  .card .art { aspect-ratio: 1; border-radius: 14px; }
  .card b { display: block; margin-top: 8px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card small { color: var(--muted); }
  .art { width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)) center / cover; object-fit: cover; display: block; }
  .actions { display: flex; gap: 10px; margin: 4px 0 16px; }
  .btn { flex: 1; border: 0; border-radius: 999px; padding: 12px 14px; font-weight: 650; font-size: 14px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); text-decoration: none; text-align: center; }
  .btn.ghost { background: var(--panel); border: 1px solid var(--line); }
  .song { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 12px; }
  .song.on { background: var(--panel); }
  .song .art { width: 46px; height: 46px; border-radius: 8px; flex: none; }
  .song .meta { flex: 1; min-width: 0; }
  .song .meta b, .song .meta small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .meta b { font-size: 14.5px; font-weight: 600; }
  .song.on .meta b { color: var(--accent); }
  .song .meta small { color: var(--muted); font-size: 12.5px; }
  .song .dur { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .song a { color: var(--muted); padding: 8px; text-decoration: none; font-size: 18px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }
  #player { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: none; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; background: rgb(23 23 28 / 0.96); border: 1px solid var(--line); box-shadow: 0 10px 30px rgb(0 0 0 / 0.5); backdrop-filter: blur(12px); }
  #player.show { display: flex; }
  #player .art { width: 48px; height: 48px; border-radius: 10px; flex: none; }
  #player .meta { flex: 1; min-width: 0; }
  #player .meta b, #player .meta small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #player .meta small { color: var(--muted); font-size: 12.5px; }
  #bar { height: 3px; margin-top: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .ctl { border: 0; background: none; color: var(--fg); font-size: 20px; width: 38px; height: 38px; border-radius: 50%; }
  .ctl.big { background: #fff; color: #000; }
</style>
</head>
<body>
<header>
  <button class="back" id="back" aria-label="Back">‹</button>
  <h1 id="title">Undertone</h1>
</header>
<main id="main"><div class="hint">Loading…</div></main>
<div id="player">
  <img class="art" id="pArt" alt="">
  <div class="meta"><b id="pTitle"></b><small id="pArtist"></small><div id="bar"><i></i></div></div>
  <button class="ctl" id="prev" aria-label="Previous">⏮</button>
  <button class="ctl big" id="play" aria-label="Play or pause">⏸</button>
  <button class="ctl" id="next" aria-label="Next">⏭</button>
</div>
<audio id="audio" preload="auto"></audio>
<script>
"use strict";
const key = new URLSearchParams(location.search).get("k") || "";
const q = (path, extra = "") => `${path}?k=${encodeURIComponent(key)}${extra}`;
const $ = (id) => document.getElementById(id);
const audio = $("audio");
let queue = null; // { id, songs, at }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function art(cover, cls = "art") {
  const img = el("img", cls);
  img.alt = "";
  img.loading = "lazy";
  if (cover) img.src = q(`/cover/${cover}`);
  else img.removeAttribute("src");
  img.onerror = () => img.removeAttribute("src");
  return img;
}
const time = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
async function get(path) {
  const r = await fetch(q(path));
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function showLists() {
  $("title").textContent = "Undertone";
  $("back").classList.remove("show");
  const main = $("main");
  try {
    const lists = await get("/api/lists");
    main.replaceChildren();
    const grid = el("div", "grid");
    for (const l of lists) {
      const card = el("button", "card");
      card.append(art(l.cover), el("b", null, l.name), el("small", null, `${l.count} song${l.count === 1 ? "" : "s"}`));
      card.onclick = () => { history.pushState({ list: l.id }, ""); showList(l.id); };
      grid.append(card);
    }
    main.append(grid);
  } catch (e) {
    main.replaceChildren(el("div", "hint", `Couldn't reach Undertone. Is it running with Phone sync on? (${e.message})`));
  }
}

async function showList(id) {
  $("back").classList.add("show");
  const main = $("main");
  main.replaceChildren(el("div", "hint", "Loading…"));
  try {
    const list = await get(`/api/list/${id}`);
    $("title").textContent = list.name;
    main.replaceChildren();
    const actions = el("div", "actions");
    const playAll = el("button", "btn", "▶  Play");
    playAll.onclick = () => play(id, list.songs, 0);
    const zip = el("a", "btn ghost", "⬇  Download all");
    zip.href = q(`/zip/${id}`);
    actions.append(playAll, zip);
    main.append(actions);
    if (!list.songs.length) main.append(el("div", "hint", "No songs on the PC in this playlist."));
    list.songs.forEach((s, i) => {
      const row = el("div", "song");
      row.dataset.i = i;
      const meta = el("div", "meta");
      meta.append(el("b", null, s.title), el("small", null, s.artist));
      const dl = el("a", null, "⬇");
      dl.href = q(`/song/${id}/${i}`, "&dl=1");
      dl.setAttribute("aria-label", `Download ${s.title}`);
      dl.onclick = (e) => e.stopPropagation();
      row.append(art(s.cover), meta, el("span", "dur", time(s.duration)), dl);
      row.onclick = () => play(id, list.songs, i);
      main.append(row);
    });
    mark();
  } catch (e) {
    main.replaceChildren(el("div", "hint", e.message));
  }
}

function play(id, songs, at) {
  queue = { id, songs, at };
  load();
}
function load() {
  const s = queue.songs[queue.at];
  audio.src = q(`/song/${queue.id}/${queue.at}`);
  audio.play().catch(() => {});
  $("player").classList.add("show");
  $("pTitle").textContent = s.title;
  $("pArtist").textContent = s.artist;
  const img = $("pArt");
  if (s.cover) img.src = q(`/cover/${s.cover}`); else img.removeAttribute("src");
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist, album: s.album, artwork: s.cover ? [{ src: q(`/cover/${s.cover}`) }] : [] });
  }
  mark();
}
function step(d) {
  if (!queue) return;
  const at = queue.at + d;
  if (at < 0 || at >= queue.songs.length) return;
  queue.at = at;
  load();
}
function mark() {
  document.querySelectorAll(".song").forEach((r) => r.classList.toggle("on", !!queue && history.state?.list === queue.id && Number(r.dataset.i) === queue.at));
}

audio.onplay = () => ($("play").textContent = "⏸");
audio.onpause = () => ($("play").textContent = "▶");
audio.onended = () => step(1);
audio.ontimeupdate = () => { $("bar").firstElementChild.style.width = `${audio.duration ? (audio.currentTime / audio.duration) * 100 : 0}%`; };
$("play").onclick = () => (audio.paused ? audio.play() : audio.pause());
$("prev").onclick = () => (audio.currentTime > 3 ? (audio.currentTime = 0) : step(-1));
$("next").onclick = () => step(1);
$("bar").onclick = (e) => { if (audio.duration) audio.currentTime = (e.offsetX / e.currentTarget.clientWidth) * audio.duration; };
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
  navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
}
$("back").onclick = () => history.back();
window.onpopstate = (e) => (e.state?.list != null ? showList(e.state.list) : showLists());
history.replaceState({}, "");
showLists();
</script>
</body>
</html>
