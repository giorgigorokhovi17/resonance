[package]
name = "resonance"
version = "0.7.9"
description = "Local-only high-fidelity music player"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "resonance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# audio
symphonia = { version = "0.6", features = ["all-codecs", "all-formats", "opt-simd"] }
symphonia-adapter-libopus = "0.3"
cpal = "0.18"
wasapi = "0.26"
rtrb = "0.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse"] }
rubato = "5"

# library
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
rayon = "1"
notify = "8"
notify-debouncer-full = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
blake3 = "1"
# playlist interchange (both already in the dependency tree via tauri)
quick-xml = "0.42"
percent-encoding = "2"
# checksums of the tools YouTube downloads need (already in the build through tauri)
sha2 = "0.10"
# playlist matcher: NFKC/NFKD text normalisation
unicode-normalization = "0.1"

# os integration (SMTC / media keys)
souvlaki = "0.8"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# soulseek downloads. Pinned exactly: upstream ships breaking releases often (docs/soulseek-design.md).
soulseek-rs-lib = "=19.1.0"

# paste-a-link playlist import (both already in the build through tauri)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["time"] }

# global play/pause, next, previous and volume shortcuts (hotkeys.rs)
tauri-plugin-global-shortcut = "2"
# the island's visualizer (audio/viz.rs); already in the build through rubato
realfft = "3"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
