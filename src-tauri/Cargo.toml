# The workspace: this app and the platform-neutral core beside it (../core). Cargo.lock and
# target/ stay here, so the commands in AGENTS.md and scripts/release.ps1 work as before.
[workspace]
members = [".", "../core"]
default-members = [".", "../core"]
resolver = "2"

[workspace.package]
version = "0.7.19"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[package]
name = "resonance"
version.workspace = true
description = "Local-only high-fidelity music player"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "resonance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
undertone-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
percent-encoding = "2"
base64 = "0.22"

# Desktop only (the Android app has none of these: docs/android-design.md §0).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# os integration (SMTC / media keys)
souvlaki = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# global play/pause, next, previous and volume shortcuts (hotkeys.rs)
tauri-plugin-global-shortcut = "2"
# phone sync (phone.rs): the small web server on the home network, the QR code to open it, and
# playlists as one .zip (stored, no compression; already in the build through another crate)
tiny_http = "0.12"
qrcodegen = "1"
zip = { version = "4", default-features = false }

# The island (island.rs) and the Soulseek sign-in in Credential Manager (sources/credentials.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
# the examples (examples/*.rs) read files and tags directly
symphonia = { version = "0.6", features = ["all-codecs", "all-formats", "opt-simd"] }
lofty = "0.25"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: it takes much of the build folder's space, and stepping through
# other crates' code isn't needed. Our own code keeps full debug info.
debug = false
