# Runs the checks from AGENTS.md on every pull request: the frontend typecheck, the backend
# warnings check and the Rust tests on Windows, and the warnings check for Android.
#
# The Rust steps take over 10 minutes, so they're skipped when nothing in src-tauri or core changed
# (version bumps don't count). To run everything anyway, start the workflow by hand
# (Actions → Checks → Run workflow) or put [full checks] in the pull request's title.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, warnings and tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # The backend stays warning-free: any warning fails the check.
      RUSTFLAGS: -D warnings
      # src-tauri/.cargo/config.toml points libopus's build at the CMake inside Visual Studio 2022
      # Build Tools, which the runner doesn't have; it keeps a CMAKE that's already set, so use
      # the runner's own (on PATH).
      CMAKE: cmake
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the Rust code change?
        id: rust
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [[ "$TITLE" == *"[full checks]"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "Full checks requested."; exit 0
          fi
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "No base to compare with: running everything."; exit 0
          fi
          files=$(git diff --name-only "$base"...HEAD -- src-tauri core)
          # Version bumps only touch the version line of these files.
          meta="src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json"
          other=$(echo "$files" | grep -v -x -F -e src-tauri/Cargo.toml -e src-tauri/Cargo.lock -e src-tauri/tauri.conf.json || true)
          meta_lines=$(git diff -U0 "$base"...HEAD -- $meta | grep -E '^[+-][^+-]' | grep -v -E '^[+-][[:space:]]*"?version"?[[:space:]]*[=:]' || true)
          if [ -n "$other" ] || [ -n "$meta_lines" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "Rust side changed:"; echo "$files"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing in src-tauri or core changed (besides the version): skipping the Rust steps."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend packages
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck

      # The backend serves the built frontend from ../dist.
      - name: Build the frontend
        run: corepack pnpm exec vite build

      - uses: dtolnay/rust-toolchain@stable
        if: steps.rust.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outputs.changed == 'true'
        with:
          workspaces: src-tauri

      - name: Warnings check
        if: steps.rust.outputs.changed == 'true'
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Rust tests
        if: steps.rust.outputs.changed == 'true'
        working-directory: src-tauri
        run: cargo test

  # The app also builds for Android arm64 (docs/android-design.md). The runner's NDK provides the
  # C compilers (SQLite, libopus).
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      RUSTFLAGS: -D warnings
      # src-tauri/.cargo/config.toml points at a Windows CMake unless CMAKE is set.
      CMAKE: cmake
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The app's build script needs the built frontend.
      - name: Build the frontend
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Warnings check for Android arm64
        working-directory: src-tauri
        run: |
          sudo apt-get install -y ninja-build
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android34-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android34-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android34-clang"
          cargo check --all-targets --target aarch64-linux-android
